name: buildlibs

on: [ workflow_dispatch ]

jobs:
  building:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: 'x86'
            abi: 'x86'
            android_abi: 'x86'
          - name: 'armeabi-v7a'
            abi: 'armeabi-v7a'
            android_abi: 'armeabi-v7a'
          - name: 'arm64-v8a'
            abi: 'arm64-v8a'
            android_abi: 'arm64-v8a'

    name: buildlibs - ${{ matrix.arch.name }}

    steps:
      - name: checkout code
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@5bc54e77d3f78364d4e333b1c8eedcf9414c5e64
        id: setup-ndk
        with:
          ndk-version: r30
      - name: Cache Android NDK
        uses: actions/cache@main
        with:
          path: /home/runner/.setup-ndk/r30
          key: ${{ runner.os }}-ndk-r30
      - name: Restore Android Symlinks # fixes by DmitriySalnikov
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          find "$directory" -type l | while read link; do
              current_target=$(readlink "$link")
              new_target="$directory/$(basename "$current_target")"
              ln -sf "$new_target" "$link"
              echo "Changed $(basename "$link") from $current_target to $new_target"
          done
      - name: Updating Cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '4.4.2'

      - name: Configuration CMake For Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build-${{ matrix.arch.abi }}
          cd build-${{ matrix.arch.abi }}
          cmake -S . -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch.android_abi }} \
            -DANDROID_NDK=$ANDROID_NDK_HOME \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLLY=ON \
            ..

      - name: Compiled-gamelibs-${{ matrix.arch.name }}
        run: |
          cd build-${{ matrix.arch.abi }}
          cmake --build . -j$(nproc)

      - name: uploading artifact ${{ matrix.arch.name }}
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: android-${{ matrix.arch.abi }}-artifacts
          path: |
            build-${{ matrix.arch.abi }}/cl_dll/*.so
            build-${{ matrix.arch.abi }}/dlls/*.so

