name: buildlibs

on: [ workflow_dispatch ]

jobs:
  building:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: 'x86'
            abi: 'x86'
            android_abi: 'x86'
          - name: 'armeabi-v7a'
            abi: 'armeabi-v7a'
            android_abi: 'armeabi-v7a'
          - name: 'arm64-v8a'
            abi: 'arm64-v8a'
            android_abi: 'arm64-v8a'

    name: buildlibs - x86/arm7l/arm64

    steps:
      - name: checkout code
        uses: actions/checkout@main
        with:
          submodules: recursive
      - name: Cache NDK
        uses: actions/cache@main
        id: android-ndk
        with:
          path: ${ANDROID_HOME}/ndk/30.0.16248370
          key: android-ndk-30.0.16248370
      - name: Install NDK 
        run: echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.16248370"
      - name: Updating Cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '4.4.4'

      - name: Configuration CMake For Android
        run: |
          mkdir -p build-${{ matrix.arch.abi }}
          cd build-${{ matrix.arch.abi }}
          cmake -S . -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch.android_abi }} \
            -DANDROID_NDK=${ANDROID_NDK} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLLY=ON \
            ..

      - name: Compiled-gamelibs-${{ matrix.arch.name }}
        run: |
          cd build-${{ matrix.arch.abi }}
          cmake --build . -j$(nproc)

      - name: uploading artifact ${{ matrix.arch.name }}
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: android-${{ matrix.arch.abi }}-artifacts
          path: |
            build-${{ matrix.arch.abi }}/cl_dll/*.so
            build-${{ matrix.arch.abi }}/dlls/*.so

