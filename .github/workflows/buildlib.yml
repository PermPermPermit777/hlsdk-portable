name: buildlibs

on: [ workflow_dispatch ]

jobs:
  building:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: 'x86'
            abi: 'x86'
            android_abi: 'x86'
          - name: 'armeabi-v7a'
            abi: 'armeabi-v7a'
            android_abi: 'armeabi-v7a'
          - name: 'arm64-v8a'
            abi: 'arm64-v8a'
            android_abi: 'arm64-v8a'

    name: buildlibs - ${{ matrix.arch.name }}

    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: setting up ndk
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk
        with:
          ndk-version: r30
      - name: Cache Android NDK
        uses: actions/cache@v6.1.0
        with:
          path: /home/runner/.setup-ndk/r30
          key: ${{ runner.os }}-ndk-r30
          restore-keys: |
           ${{ runner.os }}-ndk-
      - name: setting up cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '4.4.2'

      - name: configures cmake for ${{ matrix.arch.name }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build-${{ matrix.arch.abi }}
          cd build-${{ matrix.arch.abi }}
          cmake -S . -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch.android_abi }} \
            -DANDROID_NDK=$ANDROID_NDK_HOME \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLLY=ON \
            ..

      - name: Compiled-gamelibs-${{ matrix.arch.name }}
        run: |
          cd build-${{ matrix.arch.abi }}
          cmake --build . -j$(nproc)

      - name: uploading artifact ${{ matrix.arch.name }}
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-${{ matrix.arch.abi }}-artifacts
          path: |
            build-${{ matrix.arch.abi }}/cl_dll/*.so
            build-${{ matrix.arch.abi }}/dlls/*.so

