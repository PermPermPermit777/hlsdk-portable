name: merge
on:
  workflow_dispatch:
jobs:
  merge-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Merge master -> CLAnniversary
        uses: devmasx/merge-branch@master
        with:
          type: now
          target_branch: CLAnniversary
          message: merge ${{ github.sha }} into CLAnniversary
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge master -> theyhunger
        uses: devmasx/merge-branch@master
        with:
          type: now
          target_branch: theyhunger
          message: merge ${{ github.sha }} into theyhunger
          github_token: ${{ secrets.GITHUB_TOKEN }}
